<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error | PHELTI</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-phelti.svg}">
  <link rel="stylesheet" th:href="@{/css/phelti.css}">
</head>
<body>
  <nav th:replace="~{fragments/layout :: navegacion}"></nav>
  <div class="layout-shell">
    <aside th:replace="~{fragments/layout :: lateral}"></aside>
    <main class="main-content" id="contenido">
      <div th:replace="~{fragments/layout :: alertas}"></div>
      <div class="error-pane"><div class="error-icon">!</div><p class="eyebrow">NO SE PUDO CARGAR ESTA PÁGINA</p><h1 th:text="${codigoEstado == 404 ? 'Página no encontrada' : 'No se pudo completar la solicitud'}">Error</h1><p th:text="${mensaje ?: 'Ha ocurrido un problema al conectar con el servicio.'}">Mensaje</p><p class="small text-muted">Regresa a la página anterior o inténtalo nuevamente. Si el problema persiste, verifica la conexión con el servicio.</p><div class="d-flex gap-2 justify-content-center"><a class="btn btn-primary" th:href="@{/}">Ir al inicio</a><button class="btn btn-outline-secondary" type="button" onclick="window.history.back()">Volver</button></div></div>
      <footer th:replace="~{fragments/layout :: pie}"></footer>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script th:src="@{/js/phelti.js}" defer></script>
</body>
</html>
