<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitud no disponible | PHELTI</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-phelti.svg}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/phelti.css}">
</head>
<body>
  <main class="container py-5">
    <div class="error-pane">
      <img th:src="@{/img/logo-phelti.svg}" width="42" height="48" alt="PHELTI">
      <h1 class="mt-3" th:text="${status == 404 ? 'Página no encontrada' : 'No se pudo completar la solicitud'}">Solicitud no disponible</h1>
      <p>Regresa al inicio o inténtalo nuevamente.</p>
      <a class="btn btn-primary" th:href="@{/}">Ir al inicio</a>
    </div>
  </main>
</body>
</html>
