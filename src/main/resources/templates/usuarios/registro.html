<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear usuario | PHELTI</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-phelti.svg}">
  <link rel="stylesheet" th:href="@{/css/phelti.css}">
</head>
<body>
  <nav th:replace="~{fragments/layout :: navegacion}"></nav>
  <div class="layout-shell">
    <aside th:replace="~{fragments/layout :: lateral}"></aside>
    <main class="main-content" id="contenido">
      <div th:replace="~{fragments/layout :: alertas}"></div>
      <header class="page-heading"><p class="eyebrow">PARTICIPANTES</p><h1>Crear usuario</h1><p>Al registrarte se abrirá automáticamente una billetera de tiempo con saldo inicial cero.</p></header>
<section class="panel narrow-panel">
  <form method="post" th:action="@{/usuarios/registrar}" th:object="${registroForm}" class="row g-3">
    <div class="col-12"><label for="nombre" class="form-label">Nombre completo *</label><input id="nombre" class="form-control" th:field="*{name}" maxlength="100" required placeholder="Ej. Laura Gómez"></div>
    <div class="col-12"><label for="correo" class="form-label">Correo electrónico *</label><input type="email" id="correo" class="form-control" th:field="*{email}" maxlength="150" required placeholder="nombre@ejemplo.com"></div>
    <div class="col-12"><label for="descripcion" class="form-label">Cuéntanos sobre ti</label><textarea id="descripcion" rows="4" class="form-control" th:field="*{description}" placeholder="Qué te gusta compartir con otros" maxlength="1500"></textarea></div>
    <div class="col-12 d-flex gap-2"><button type="submit" class="btn btn-primary">Crear cuenta</button><a class="btn btn-outline-secondary" th:href="@{/}">Cancelar</a></div>
  </form>
</section>
      <footer th:replace="~{fragments/layout :: pie}"></footer>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script th:src="@{/js/phelti.js}" defer></script>
</body>
</html>
